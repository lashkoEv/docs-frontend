version: 0.2

phases:
  pre_build:
    commands:
      - REPO_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
      - IMAGE_TAG="$CODEBUILD_BUILD_NUMBER"
      - echo "Logging in to Amazon ECR ($REPO_URI)"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - NEXT_PUBLIC_API_URL=$(aws ssm get-parameter --name "$SSM_API_URL_PARAM" --query 'Parameter.Value' --output text)
      - echo "Building against API $NEXT_PUBLIC_API_URL"
  build:
    commands:
      - echo "Building image $REPO_URI:$IMAGE_TAG"
      - |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
          --build-arg NEXT_PUBLIC_S3_PUBLIC_URL="$NEXT_PUBLIC_S3_PUBLIC_URL" \
          -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .
  post_build:
    commands:
      - echo "Pushing images"
      - docker push "$REPO_URI:$IMAGE_TAG"
      - docker push "$REPO_URI:latest"
      - echo "Rendering new task definition revision"
      - aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query 'taskDefinition' --output json > task-def.json
      - |
        jq --arg IMAGE "$REPO_URI:$IMAGE_TAG" --arg NAME "$CONTAINER_NAME" \
          '.containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
           | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
          task-def.json > new-task-def.json
      - NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
      - echo "Registered $NEW_TASK_DEF_ARN"
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_DEF_ARN" --force-new-deployment
      - echo "Waiting for service to stabilize"
      - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"