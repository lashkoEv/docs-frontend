stages:
  - lint
  - package
  - deploy

variables:
  SOURCE_BUCKET: docs-codebuild-source-262981515095
  SOURCE_KEY: docs-frontend/source.zip

lint:
  stage: lint
  image: node:23-alpine
  script:
    - npm ci
    - npx eslint --max-warnings=0

package:
  stage: package
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  before_script:
    - yum install -y zip
  script:
    - zip -r source.zip . -x '.git/*' 'node_modules/*'
    - aws s3 cp source.zip "s3://$SOURCE_BUCKET/$SOURCE_KEY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - BUILD_ID=$(aws codebuild start-build --project-name "$CODEBUILD_PROJECT" --query 'build.id' --output text)
    - echo "Started CodeBuild $BUILD_ID"
    - |
      while true; do
        STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
        echo "CodeBuild status: $STATUS"
        case "$STATUS" in
          SUCCEEDED) break ;;
          IN_PROGRESS) sleep 15 ;;
          *) echo "CodeBuild failed with status $STATUS"; exit 1 ;;
        esac
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
